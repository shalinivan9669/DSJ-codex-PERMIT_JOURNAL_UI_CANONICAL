pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 12m;
  server_tokens off;
  map $http_next_action $legacy_action { default 1; '' 0; }
  server {
    listen 8443 ssl;
    ssl_certificate /etc/demo-tls/tls.crt;
    ssl_certificate_key /etc/demo-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DEMO_TLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    if ($legacy_action) { return 404; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Demo-Client-IP $remote_addr;
    proxy_set_header X-Demo-Proxy-Key "${DEMO_PROXY_KEY}";
    # These are the only routes that admit large multipart requests.
    location ~ ^/api/lms/courses/[A-Za-z0-9_-]+/materials$ {
      if ($request_method != POST) { return 404; }
      client_max_body_size 513m;
      client_body_timeout 60s;
      proxy_request_buffering off;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api:4100;
      proxy_read_timeout 240s;
      proxy_buffering off;
    }
    location ~ ^/api/lms/enrollments/[A-Za-z0-9_-]+/external-evidence$ {
      if ($request_method != POST) { return 404; }
      client_max_body_size 21m;
      proxy_request_buffering off;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api:4100;
      proxy_read_timeout 60s;
      proxy_buffering off;
    }
    # This upstream is exclusively the autonomous DEMO API. It also enforces its own exact policy.
    location /api/ {
      proxy_pass http://api:4100/;
      proxy_read_timeout 60s;
      proxy_buffering off;
    }
    location = / { if ($request_method !~ ^(GET|HEAD)$) { return 404; } proxy_pass http://web:3100; }
    location = /login { if ($request_method !~ ^(GET|HEAD)$) { return 404; } proxy_pass http://web:3100; }
    location ~ ^/(requests(?:/new|/[A-Za-z0-9_-]+(?:/edit)?)?|customers|history|settings|workbench|orders(?:/[A-Za-z0-9_-]+)?)$ {
      if ($request_method !~ ^(GET|HEAD)$) { return 404; }
      proxy_pass http://web:3100;
    }
    location ~ ^/(lms(?:/courses/[A-Za-z0-9_-]+|/assign|/results|/sanitary|/groups(?:/[A-Za-z0-9_-]+)?)?|learn(?:/[A-Za-z0-9_-]+)?|sanitary)$ {
      if ($request_method !~ ^(GET|HEAD)$) { return 404; }
      proxy_pass http://web:3100;
    }
    location ~ ^/_next/static/[A-Za-z0-9_./()\[\]-]+\.(js|css|woff2?|ttf)$ { if ($request_method !~ ^(GET|HEAD)$) { return 404; } proxy_pass http://web:3100; }
    location / { return 404; }
  }
}

pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 12m;
  server_tokens off;
  map $http_next_action $legacy_action { default 1; '' 0; }
  server {
    listen 8080;
    if ($legacy_action) { return 404; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # This upstream is exclusively the autonomous DEMO API. It also enforces its own exact policy.
    location /api/ {
      proxy_pass http://api:4100/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 60s;
      proxy_buffering off;
    }
    location = / { if ($request_method !~ ^(GET|HEAD)$) { return 404; } proxy_pass http://web:3100; }
    location = /login { if ($request_method !~ ^(GET|HEAD)$) { return 404; } proxy_pass http://web:3100; }
    location ~ ^/(requests(?:/new|/[A-Za-z0-9_-]+(?:/edit)?)?|customers|history|settings)$ {
      if ($request_method !~ ^(GET|HEAD)$) { return 404; }
      proxy_pass http://web:3100;
    }
    location ~ ^/_next/static/[A-Za-z0-9_./()\[\]-]+\.(js|css|woff2?|ttf)$ { if ($request_method !~ ^(GET|HEAD)$) { return 404; } proxy_pass http://web:3100; }
    location / { return 404; }
  }
}


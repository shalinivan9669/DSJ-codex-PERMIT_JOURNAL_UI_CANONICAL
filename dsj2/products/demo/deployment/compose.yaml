name: demo
x-runtime: &runtime
  build: { context: .., dockerfile: deployment/Dockerfile, target: runtime }
  image: demo-api:2.0.0
  init: true
  restart: unless-stopped
  read_only: true
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=512m,uid=1000,gid=1000"]
  # Share both the artifact tree and its sibling maintenance lock across jobs.
  volumes: [private-files:/data]
  environment: &environment
    NODE_ENV: production
    HOST: 0.0.0.0
    DATABASE_URL: postgresql://demo:${DEMO_DB_PASSWORD:?Set a strong URL-safe DEMO_DB_PASSWORD}@db:5432/demo?schema=public
    DEMO_PRODUCT_ID: demo-product
    DEMO_ORIGIN: ${DEMO_ORIGIN:?Set the exact HTTPS public origin}
    DEMO_ARTIFACT_ROOT: /data/artifacts
    DEMO_PYTHON: python3
    DEMO_SOFFICE: /opt/libreoffice26.2/program/soffice
    DEMO_RENDER_CONCURRENCY: "2"
  depends_on: { db: { condition: service_healthy } }
  stop_grace_period: 60s
  mem_limit: 2g
  cpus: 2
  pids_limit: 256
  networks: [private]

services:
  db:
    build: { context: .., dockerfile: deployment/Dockerfile.postgres }
    image: demo-postgres:18.6-no-xml
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      [
        "/tmp:rw,noexec,nosuid,size=64m,uid=70,gid=70",
        "/var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70",
      ]
    environment:
      {
        POSTGRES_USER: demo,
        POSTGRES_PASSWORD: "${DEMO_DB_PASSWORD:?Set password}",
        POSTGRES_DB: demo,
        POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ru-KZ",
      }
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U demo -d demo"],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    networks: [private]
  api:
    <<: *runtime
    healthcheck:
      {
        test:
          [
            "CMD",
            "node",
            "-e",
            'fetch("http://localhost:4100/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
          ],
        interval: 15s,
        timeout: 5s,
        retries: 5,
      }
  worker:
    <<: *runtime
    command: [pnpm, --filter, "@demo/render-worker", start]
    mem_limit: 3g
  migrate:
    <<: *runtime
    restart: "no"
    command: [pnpm, db:deploy]
    profiles: [admin]
  setup:
    <<: *runtime
    restart: "no"
    command: [pnpm, run, setup]
    environment:
      <<: *environment
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_TENANT_NAME: ${DEMO_TENANT_NAME:-}
    profiles: [admin]
  web:
    build: { context: .., dockerfile: deployment/Dockerfile, target: web }
    image: demo-web:2.0.0
    environment:
      {
        NODE_ENV: production,
        DEMO_API_URL: "http://api:4100",
        DEMO_ORIGIN: "${DEMO_ORIGIN:?Set origin}",
      }
    user: "1000:1000"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      [
        "/tmp:rw,nosuid,size=64m,uid=1000,gid=1000",
        "/app/apps/web/.next/cache:rw,nosuid,size=128m,uid=1000,gid=1000",
      ]
    healthcheck:
      {
        test:
          [
            "CMD",
            "node",
            "-e",
            'fetch("http://localhost:3100/login").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
          ],
        interval: 15s,
        timeout: 5s,
        retries: 5,
      }
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    networks: [private]
  ingress:
    build: { context: .., dockerfile: deployment/Dockerfile.nginx }
    image: demo-ingress:2.0.0
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    tmpfs: ["/tmp:rw,nosuid,size=32m,uid=101,gid=101"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      {
        api: { condition: service_healthy },
        web: { condition: service_healthy },
      }
    restart: unless-stopped
    mem_limit: 128m
    networks: [private]

volumes:
  database:
  private-files:
networks:
  private:
